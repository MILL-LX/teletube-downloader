[project]
name = "teletube-downloader"
version = "0.1.0"
description = "Fetches all videos from a YouTube channel and downloads them to local storage, organized by publish year."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.197.0",
    "python-dotenv>=1.2.2",
    "yt-dlp>=2026.3.17",
]
